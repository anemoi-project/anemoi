# Architecture-neutral Q64 pure-INT8 production policy for SM89 and SM120.
# V-aware Mean20 L2-L49 budget is inherited from SparseConfig.
query_block_size: 64
prefix_kv_precision: int8
prefix_query_precision: int8

# The INT8 phase uses symmetric INT8 Q/K and E4M3 V on both architectures.
nvfp4_ratio: 0.0
int8_ratio: 1.0
fp16_ratio: 0.0

# Keep all transformer layers dense for the first 10 denoising steps, and keep
# the first two transformer layers dense for every step.
dense_first_steps: 10
dense_first_layers: 2
