# Default sparsity outside the layer-specific bands below. A value of 0.9
# drops about 90% of routed video block pairs and retains about 10%.
sparsity_ratio: 0.9

# Zero-based, half-open layer ranges: [first_layer, last_layer, sparsity].
# Layers 18-33 use 85% sparsity; layers 34-49 use 65% sparsity.
layer_sparsity_bands:
  - [18, 34, 0.85]
  - [34, 50, 0.65]

# Split retained block pairs between the FP8 and FP16 phases. The two
# positive values must add up to 1.0.
fp8_ratio: 0.8
fp16_ratio: 0.2

# Keep all transformer layers dense for the first 10 denoising steps, and keep
# the first two transformer layers dense for every step.
dense_first_steps: 10
dense_first_layers: 2

# Select a validated logical tile for the requested video shape. If disabled,
# tile_shape is used directly; its area must not exceed 64.
adaptive_tile: true
tile_shape: [8, 8]
