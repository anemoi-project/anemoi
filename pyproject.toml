[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "anemoi"
version = "0.0.1"
description = "Efficient Visual Generation inference engine"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Anemoi Project" }]
classifiers = ["License :: OSI Approved :: Apache Software License"]
dependencies = []

[project.optional-dependencies]
runtime = [
  "accelerate>=1.0",
  "diffusers>=0.35.0",
  "huggingface_hub>=0.25",
  "imageio-ffmpeg>=0.5",
  "pillow>=10",
  "safetensors>=0.4",
  "torch>=2.4",
  "transformers>=4.50",
]
kernels = [
  "triton>=3.0; platform_system == 'Linux'",
]
minimax-h3 = [
  "accelerate==1.14.0",
  "av==18.0.0",
  "huggingface_hub>=1.0",
  "numpy==2.3.5",
  "pillow>=10",
  "requests>=2.32",
  "safetensors==0.8.0",
  "torch>=2.7,<2.12",
  "transformers==5.11.0",
  "triton>=3.3,<3.8; platform_system == 'Linux'",
]
server = [
  "fastapi>=0.115",
  "pydantic>=2.8",
  "uvicorn[standard]>=0.30",
]
dev = [
  "mypy>=1.11",
  "pytest>=8.0",
  "ruff>=0.6",
]

[project.scripts]
anemoi = "anemoi.cli.main:main"

[tool.setuptools.packages.find]
include = ["anemoi*"]

[tool.setuptools.package-data]
"anemoi.models.minimax_h3" = ["assets/*.pt", "configs/*.json"]

[tool.ruff]
line-length = 100
target-version = "py310"
